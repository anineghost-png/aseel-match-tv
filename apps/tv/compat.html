<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>فحص التوافق</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <a href="/">← العودة</a>
      <h1>فحص توافق جهازك</h1>
      <p>
        وجود الميزة لا يثبت تشغيل الفيديو. قبول PS4 يحتاج اختبارًا فعليًا على
        جهازك.
      </p>
      <button id="probe">فحص وحفظ قدرات الجهاز</button>
      <p id="result" role="status"></p>
      <pre id="report"></pre>
      <h2>اختبار فيديو مولّد محليًا</h2>
      <p>
        شغّل npm run media على الخادم أولًا. سيُسجّل النجاح فقط بعد تقدم الفيديو
        ٣ ثوانٍ.
      </p>
      <button id="test-native">اختبار HLS الأصلي</button
      ><button id="test-mse">اختبار HLS.js</button
      ><video id="test-video" controls></video>
      <p id="video-result" role="status"></p>
      <a class="secondary" href="/controller">اختبار يد التحكم</a>
    </main>
    <script src="/common.js"></script>
    <script src="/focus.js"></script>
    <script src="/compat.js"></script>
    <script src="/video-test.js"></script>
  </body>
</html>
